# Purpose: prove that the checker tree and built image behave identically on both release architectures.
# Role: PR and main-push gate.

name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-harness:
    name: host harness (spike replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Release consistency
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$version" = 2.0.0
          grep -Fqx "      version: ${version}" .github/workflows/check.yaml
          grep -Fqx "image=ghcr.io/nwarila-platform/workflow-template-drift:${version}" tools/template-drift.sh
          test "$(git ls-files -s tools/template-drift.sh | cut -c1-6)" = 100755
      - name: Harness
        run: |
          set -euo pipefail
          python3.12 -m venv --without-pip .runtime
          ln -s ../../../../workflow_template_drift .runtime/lib/python3.12/site-packages/workflow_template_drift
          PATH="$PWD/.runtime/bin:$PATH" python3.12 -B -m unittest discover -s . -t . -v 2>&1 | tee .runtime/unittest.output
          grep -q '^Ran 18 tests' .runtime/unittest.output
          grep -q '^OK$' .runtime/unittest.output
  image-parity:
    name: image parity (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {arch: [amd64, arm64]}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: buildx
        with:
          version: v0.35.0
          driver: docker-container
          driver-opts: image=docker.io/moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
          cache-binary: false
      - name: Build image
        env:
          ARCH: ${{ matrix.arch }}
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: docker buildx build --builder "$BUILDER" --file Containerfile --platform "linux/$ARCH" --tag "workflow-template-drift:ci-$ARCH" --load .
      - name: Image identity and ABI
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="workflow-template-drift:ci-$ARCH"
          test "$(docker image inspect "$image" --format '{{.Config.User}} {{json .Config.Entrypoint}}')" = '65532:65532 ["/usr/bin/python3.12","-I","-X","utf8","-B","-m","workflow_template_drift"]'
          status=0
          docker run --rm --platform "linux/$ARCH" --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/fixtures/determinism/workspace:/workspace:ro" -v "$PWD/fixtures/determinism/source:/template:ro" "$image" \
            --workspace /workspace --template example/determinism=/template --config drift.json --format text >actual.text || status=$?
          test "$status" -eq 1
          cmp actual.text fixtures/goldens/determinism.text
          status=0
          docker run --rm --platform "linux/$ARCH" --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/fixtures/determinism/workspace:/workspace:ro" -v "$PWD/fixtures/determinism/source:/template:ro" "$image" \
            --workspace /workspace --template example/determinism=/template --config drift.json --format patch >actual.patch || status=$?
          test "$status" -eq 1
          cmp actual.patch fixtures/goldens/determinism.patch
