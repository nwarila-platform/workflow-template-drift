# Purpose: prove that the checker source and the built image behave identically on both release architectures.
# Role: PR and main-push gate. Governed byte for byte by workflow-container-template; the container's own
# tests live in tests/host.sh and tests/image.sh, which publish.yaml also runs before promotion.

name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: host harness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Name and release binding
        run: |
          set -euo pipefail
          # The repository name is the container's name: check.yaml must declare the same one.
          name=$(sed -n 's/^      name: \([a-z0-9-]*\)$/\1/p' .github/workflows/check.yaml)
          test "workflow-${name}" = "${GITHUB_REPOSITORY#*/}"
          [[ "$(cat VERSION)" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git ls-files -s tools/workflow-container.sh | cut -c1-6)" = 100755
      - name: Host tests
        run: bash tests/host.sh
  image-parity:
    name: image parity (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {arch: [amd64, arm64]}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: buildx
        with:
          version: v0.35.0
          driver: docker-container
          driver-opts: image=docker.io/moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
          cache-binary: false
      - name: Build image
        env:
          ARCH: ${{ matrix.arch }}
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: docker buildx build --builder "$BUILDER" --file Containerfile --platform "linux/$ARCH" --tag "workflow-container:ci-$ARCH" --load .
      - name: Image tests
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "workflow-container:ci-$ARCH" --format '{{.Config.User}}')" = 65532:65532
          bash tests/image.sh "workflow-container:ci-$ARCH" "linux/$ARCH"
