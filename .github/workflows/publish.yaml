# Purpose: build an unaliased release candidate, bind evidence to its digest, verify anonymously, then promote.
# Role: protected-tag publisher.

name: Publish workflow-template-drift

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency: {group: publish-ghcr-io-nwarila-platform-workflow-template-drift, cancel-in-progress: false}

env:
  IMAGE_REPOSITORY: ghcr.io/nwarila-platform/workflow-template-drift
  SOURCE_DATE_EPOCH: "1704067200"
  SLSA_GENERATOR_TAG: "v2.1.0"
  SLSA_GENERATOR_TAG_SHA: "f7dd8c54c2067bafc12ca7a55595d5ee9b75204a"
  BUILDKIT_SBOM_GENERATOR: docker.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
  CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  SLSA_BUILDER_ID: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.1.0

jobs:
  generator-pin:
    name: Release and SLSA tag integrity
    if: >-
      ${{ github.repository == 'nwarila-platform/workflow-template-drift' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Require a signed annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF#refs/tags/}"
          test "${GITHUB_REF}" = "refs/tags/${tag_name}"
          test "${GITHUB_REF_NAME}" = "${tag_name}"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_name}")"
          test "$(jq -r '.ref' <<<"${ref_json}")" = "${GITHUB_REF}"
          test "$(jq -r '.object.type' <<<"${ref_json}")" = tag
          tag_object_sha="$(jq -r '.object.sha' <<<"${ref_json}")"
          [[ "${tag_object_sha}" =~ ^[0-9a-f]{40}$ ]]
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          test "$(jq -r '.sha' <<<"${tag_json}")" = "${tag_object_sha}"
          test "$(jq -r '.tag' <<<"${tag_json}")" = "${tag_name}"
          test "$(jq -r '.object.type' <<<"${tag_json}")" = commit
          test "$(jq -r '.object.sha' <<<"${tag_json}")" = "${GITHUB_SHA}"
          test "$(jq -r '.verification.verified' <<<"${tag_json}")" = true
          printf 'signed annotated release tag verified: refs/tags/%s -> %s\n' "${tag_name}" "${GITHUB_SHA}"
      - name: Verify SLSA generator tag binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/slsa-framework/slsa-github-generator/git/ref/tags/${SLSA_GENERATOR_TAG}" --jq '.object.sha')"
          if [[ "${actual}" != "${SLSA_GENERATOR_TAG_SHA}" ]]; then
            printf 'SLSA generator tag drift: expected %s, got %s\n' "${SLSA_GENERATOR_TAG_SHA}" "${actual}" >&2
            exit 1
          fi
          printf 'SLSA generator tag binding passed: refs/tags/%s=%s\n' "${SLSA_GENERATOR_TAG}" "${actual}"

  publish-candidate:
    name: Publish unaliased candidate by digest
    needs: [generator-pin]
    if: >-
      ${{ github.repository == 'nwarila-platform/workflow-template-drift' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.generator-pin.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          token: ''
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver: docker-container
          driver-opts: image=docker.io/moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
          buildkitd-flags: --debug=false
          cache-binary: false
      - name: Validate repository, tag, VERSION, and commit
        id: preflight
        run: |
          set -euo pipefail
          python3.12 - <<'PY'
          import os
          import re
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["GITHUB_REF"]
          sha = os.environ["GITHUB_SHA"]
          raw = Path("VERSION").read_bytes()
          if not raw.endswith(b"\n") or raw.count(b"\n") != 1:
              raise SystemExit("VERSION must be one LF-terminated line")
          try:
              version = raw[:-1].decode("ascii")
          except UnicodeDecodeError as error:
              raise SystemExit("VERSION must be ASCII") from error
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version) is None:
              raise SystemExit(f"VERSION is not strict X.Y.Z: {version!r}")
          if repository != "nwarila-platform/workflow-template-drift":
              raise SystemExit(f"wrong publishing repository: {repository!r}")
          if ref != f"refs/tags/v{version}":
              raise SystemExit(f"release ref mismatch: expected refs/tags/v{version}, observed {ref}")
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit(f"publishing SHA is not a full lowercase commit SHA: {sha!r}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"release preflight passed: repository={repository} ref={ref} sha={sha} version={version}")
          PY
          test "$(git cat-file -t "${GITHUB_SHA}")" = commit
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Log in to GHCR for candidate publication
        env:
          GHCR_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${REGISTRY_USER}" --password-stdin
      - name: Install pinned Crane
        run: |
          set -euo pipefail
          bash tools/install-crane.sh
          printf '%s\n' "${PWD}/dist/tools" >> "${GITHUB_PATH}"
      - name: Build and push unaliased candidate
        id: image
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/publish
          docker buildx build \
            --builder "${BUILDER_NAME}" \
            --file Containerfile \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --label "org.opencontainers.image.created=2024-01-01T00:00:00Z" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --provenance=false \
            --attest "type=sbom,generator=${BUILDKIT_SBOM_GENERATOR}" \
            --metadata-file dist/publish/image-metadata.json \
            --output "type=registry,rewrite-timestamp=true,push-by-digest=true,name-canonical=true" \
            --tag "${IMAGE_REPOSITORY}" \
            .
          digest="$(python3.12 - <<'PY'
          import json
          import re
          from pathlib import Path

          metadata = json.loads(Path("dist/publish/image-metadata.json").read_text(encoding="utf-8"))
          digest = metadata.get("containerimage.digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit(f"candidate metadata digest is invalid: {digest!r}")
          print(digest)
          PY
          )"
          {
            printf 'image=%s\n' "${IMAGE_REPOSITORY}"
            printf 'digest=%s\n' "${digest}"
          } >> "${GITHUB_OUTPUT}"
          printf 'candidate index recorded: %s@%s\n' "${IMAGE_REPOSITORY}" "${digest}"
      - name: Resolve exactly two runnable children and one SPDX SBOM each
        env:
          INDEX_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          observed="$(crane digest "${IMAGE_REPOSITORY}@${INDEX_DIGEST}")"
          test "${observed}" = "${INDEX_DIGEST}"
          crane manifest "${IMAGE_REPOSITORY}@${INDEX_DIGEST}" > dist/publish/index.json
          python3.12 - dist/publish/index.json <<'PY' > dist/publish/platform-records
          import json
          import re
          import sys
          from pathlib import Path

          digest_re = re.compile(r"sha256:[0-9a-f]{64}")
          index = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if index.get("mediaType") not in {
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          }:
              raise SystemExit(f"candidate is not an OCI/Docker image index: {index.get('mediaType')!r}")
          manifests = index.get("manifests")
          if not isinstance(manifests, list) or len(manifests) != 4:
              raise SystemExit(f"index must contain two runnable and two attestation manifests: {manifests!r}")
          runnable = {}
          attestations = {}
          for descriptor in manifests:
              digest = descriptor.get("digest")
              if not isinstance(digest, str) or digest_re.fullmatch(digest) is None:
                  raise SystemExit(f"invalid descriptor digest: {digest!r}")
              platform = descriptor.get("platform") or {}
              annotations = descriptor.get("annotations") or {}
              if annotations.get("vnd.docker.reference.type") == "attestation-manifest":
                  subject = annotations.get("vnd.docker.reference.digest")
                  if subject in attestations:
                      raise SystemExit(f"duplicate attestation manifest for {subject}")
                  attestations[subject] = digest
                  continue
              key = (platform.get("os"), platform.get("architecture"))
              if key not in {("linux", "amd64"), ("linux", "arm64")} or key in runnable:
                  raise SystemExit(f"unexpected runnable descriptor platform: {platform!r}")
              runnable[key] = digest
          if set(runnable) != {("linux", "amd64"), ("linux", "arm64")}:
              raise SystemExit(f"runnable platform set mismatch: {sorted(runnable)!r}")
          if set(attestations) != set(runnable.values()):
              raise SystemExit("each runnable child must have exactly one attestation manifest")
          for arch in ("amd64", "arm64"):
              child = runnable[("linux", arch)]
              print(arch, child, attestations[child])
          PY
          while read -r arch child_digest attestation_digest; do
            crane manifest "${IMAGE_REPOSITORY}@${attestation_digest}" > "dist/publish/attestation-${arch}.json"
            layer_digest="$(python3.12 - "dist/publish/attestation-${arch}.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          layers = manifest.get("layers")
          if not isinstance(layers, list) or len(layers) != 1:
              raise SystemExit(f"attestation manifest must contain exactly one layer: {layers!r}")
          layer = layers[0]
          if layer.get("mediaType") != "application/vnd.in-toto+json":
              raise SystemExit(f"unexpected attestation layer media type: {layer.get('mediaType')!r}")
          if (layer.get("annotations") or {}).get("in-toto.io/predicate-type") != "https://spdx.dev/Document":
              raise SystemExit("attestation layer is not the SPDX predicate")
          digest = layer.get("digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit(f"invalid attestation layer digest: {digest!r}")
          print(digest)
          PY
            )"
            crane blob "${IMAGE_REPOSITORY}@${layer_digest}" > "dist/publish/sbom-${arch}.json"
            python3.12 - "${arch}" "${child_digest}" "dist/publish/sbom-${arch}.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          arch, child_digest, path = sys.argv[1:]
          statement = json.loads(Path(path).read_text(encoding="utf-8"))
          if statement.get("_type") not in {
              "https://in-toto.io/Statement/v0.1",
              "https://in-toto.io/Statement/v1",
          }:
              raise SystemExit(f"{arch} SBOM is not an in-toto statement")
          if statement.get("predicateType") != "https://spdx.dev/Document":
              raise SystemExit(f"{arch} SBOM predicate type mismatch")
          subjects = statement.get("subject")
          expected_hex = child_digest.removeprefix("sha256:")
          if not isinstance(subjects, list) or len(subjects) != 1 or (subjects[0].get("digest") or {}).get("sha256") != expected_hex:
              raise SystemExit(f"{arch} SBOM subject does not bind the runnable child")
          predicate = statement.get("predicate")
          if not isinstance(predicate, dict) or predicate.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit(f"{arch} predicate is not SPDX 2.3 JSON")
          if predicate.get("SPDXID") != "SPDXRef-DOCUMENT":
              raise SystemExit(f"{arch} SPDX document identifier mismatch")
          packages = predicate.get("packages")
          if not isinstance(packages, list) or not packages:
              raise SystemExit(f"{arch} SPDX package inventory is empty")
          print(f"{arch} candidate child and single SPDX SBOM passed: child={child_digest} packages={len(packages)}")
          PY
          done < dist/publish/platform-records

  sign:
    name: Sign candidate index and children
    needs: [publish-candidate]
    if: >-
      ${{ github.repository == 'nwarila-platform/workflow-template-drift' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Log in to GHCR for recursive signing
        env:
          GHCR_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${REGISTRY_USER}" --password-stdin
      - name: Sign immutable index and children
        env:
          INDEX_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          [[ "${INDEX_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          expected_identity="https://github.com/nwarila-platform/workflow-template-drift/.github/workflows/publish.yaml@${GITHUB_REF}"
          expected_ref="refs/tags/v$(printf '%s' "${GITHUB_REF_NAME}" | sed 's/^v//')"
          test "${GITHUB_REF}" = "${expected_ref}"
          printf 'expected keyless certificate identity: %s\n' "${expected_identity}"
          cosign sign --yes --recursive "${IMAGE_REPOSITORY}@${INDEX_DIGEST}"

  slsa:
    name: SLSA L3 provenance
    needs: [generator-pin, publish-candidate]
    if: >-
      ${{ github.repository == 'nwarila-platform/workflow-template-drift' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.generator-pin.result == 'success' &&
      needs.publish-candidate.result == 'success' }}
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.publish-candidate.outputs.image }}
      digest: ${{ needs.publish-candidate.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Anonymous evidence and runtime verification
    needs: [publish-candidate, sign, slsa]
    if: >-
      ${{ github.repository == 'nwarila-platform/workflow-template-drift' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-candidate.result == 'success' &&
      needs.sign.result == 'success' &&
      needs.slsa.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          token: ''
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Install pinned SLSA verifier
        uses: slsa-framework/slsa-verifier/actions/installer@3714a2a4684014deb874a0e737dffa0ee02dd647 # v2.6.0
        with:
          github-token: ${{ github.token }}
      - name: Install pinned Crane
        run: |
          set -euo pipefail
          bash tools/install-crane.sh
          printf '%s\n' "${PWD}/dist/tools" >> "${GITHUB_PATH}"
      - name: Create fresh empty Docker configuration
        run: |
          set -euo pipefail
          anonymous_config="${RUNNER_TEMP}/wtd2-anonymous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${anonymous_config}"
          install -d -m 0700 "${anonymous_config}"
          test -z "$(find "${anonymous_config}" -mindepth 1 -maxdepth 1 -print -quit)"
          printf 'DOCKER_CONFIG=%s\n' "${anonymous_config}" >> "${GITHUB_ENV}"
      - name: Resolve public index, children, and SPDX SBOMs anonymously
        env:
          INDEX_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${INDEX_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test ! -e "${DOCKER_CONFIG}/config.json"
          mkdir -p dist/verify
          observed="$(crane digest "${IMAGE_REPOSITORY}@${INDEX_DIGEST}")"
          test "${observed}" = "${INDEX_DIGEST}"
          crane manifest "${IMAGE_REPOSITORY}@${INDEX_DIGEST}" > dist/verify/index.json
          python3.12 - dist/verify/index.json <<'PY' > dist/verify/platform-records
          import json
          import re
          import sys
          from pathlib import Path

          digest_re = re.compile(r"sha256:[0-9a-f]{64}")
          index = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          manifests = index.get("manifests")
          if not isinstance(manifests, list) or len(manifests) != 4:
              raise SystemExit(f"index must contain exactly four descriptors: {manifests!r}")
          runnable = {}
          attestations = {}
          for descriptor in manifests:
              digest = descriptor.get("digest")
              if not isinstance(digest, str) or digest_re.fullmatch(digest) is None:
                  raise SystemExit(f"invalid descriptor digest: {digest!r}")
              platform = descriptor.get("platform") or {}
              annotations = descriptor.get("annotations") or {}
              if annotations.get("vnd.docker.reference.type") == "attestation-manifest":
                  subject = annotations.get("vnd.docker.reference.digest")
                  if subject in attestations:
                      raise SystemExit(f"duplicate attestation manifest for {subject}")
                  attestations[subject] = digest
                  continue
              key = (platform.get("os"), platform.get("architecture"))
              if key not in {("linux", "amd64"), ("linux", "arm64")} or key in runnable:
                  raise SystemExit(f"unexpected runnable descriptor platform: {platform!r}")
              runnable[key] = digest
          if set(runnable) != {("linux", "amd64"), ("linux", "arm64")}:
              raise SystemExit(f"runnable platform set mismatch: {sorted(runnable)!r}")
          if set(attestations) != set(runnable.values()):
              raise SystemExit("each runnable child must have exactly one attestation manifest")
          for arch in ("amd64", "arm64"):
              child = runnable[("linux", arch)]
              print(arch, child, attestations[child])
          PY
          while read -r arch child_digest attestation_digest; do
            crane manifest "${IMAGE_REPOSITORY}@${attestation_digest}" > "dist/verify/attestation-${arch}.json"
            layer_digest="$(python3.12 - "dist/verify/attestation-${arch}.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          layers = manifest.get("layers")
          if not isinstance(layers, list) or len(layers) != 1:
              raise SystemExit(f"attestation manifest must contain exactly one layer: {layers!r}")
          layer = layers[0]
          if layer.get("mediaType") != "application/vnd.in-toto+json":
              raise SystemExit(f"unexpected attestation layer media type: {layer.get('mediaType')!r}")
          if (layer.get("annotations") or {}).get("in-toto.io/predicate-type") != "https://spdx.dev/Document":
              raise SystemExit("attestation layer is not the SPDX predicate")
          digest = layer.get("digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit(f"invalid attestation layer digest: {digest!r}")
          print(digest)
          PY
            )"
            crane blob "${IMAGE_REPOSITORY}@${layer_digest}" > "dist/verify/sbom-${arch}.json"
            python3.12 - "${arch}" "${child_digest}" "dist/verify/sbom-${arch}.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          arch, child_digest, path = sys.argv[1:]
          statement = json.loads(Path(path).read_text(encoding="utf-8"))
          if statement.get("predicateType") != "https://spdx.dev/Document":
              raise SystemExit(f"{arch} SBOM predicate type mismatch")
          subjects = statement.get("subject")
          expected_hex = child_digest.removeprefix("sha256:")
          if not isinstance(subjects, list) or len(subjects) != 1 or (subjects[0].get("digest") or {}).get("sha256") != expected_hex:
              raise SystemExit(f"{arch} SBOM subject mismatch")
          predicate = statement.get("predicate")
          if not isinstance(predicate, dict) or predicate.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit(f"{arch} predicate is not SPDX 2.3 JSON")
          if predicate.get("SPDXID") != "SPDXRef-DOCUMENT":
              raise SystemExit(f"{arch} SPDX document identifier mismatch")
          packages = predicate.get("packages")
          if not isinstance(packages, list) or not packages:
              raise SystemExit(f"{arch} SPDX package inventory is empty")
          print(f"anonymous {arch} SPDX verification passed: child={child_digest} packages={len(packages)}")
          PY
          done < dist/verify/platform-records
      - name: Verify exact keyless signatures on index and runnable children
        env:
          INDEX_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          test ! -e "${DOCKER_CONFIG}/config.json"
          version="$(tr -d '[:space:]' < VERSION)"
          certificate_identity="https://github.com/nwarila-platform/workflow-template-drift/.github/workflows/publish.yaml@refs/tags/v${version}"
          mapfile -t children < <(awk '{print $2}' dist/verify/platform-records)
          test "${#children[@]}" -eq 2
          for digest in "${INDEX_DIGEST}" "${children[@]}"; do
            cosign verify "${IMAGE_REPOSITORY}@${digest}" \
              --certificate-identity "${certificate_identity}" \
              --certificate-oidc-issuer "${CERTIFICATE_OIDC_ISSUER}" \
              --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
              --certificate-github-workflow-sha "${GITHUB_SHA}" \
              --certificate-github-workflow-ref "${GITHUB_REF}" \
              > "dist/verify/signature-${digest#sha256:}.json"
            test -s "dist/verify/signature-${digest#sha256:}.json"
          done
      - name: Verify SLSA provenance against source URI and tag
        env:
          INDEX_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          test ! -e "${DOCKER_CONFIG}/config.json"
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF}" = "refs/tags/v${version}"
          slsa-verifier verify-image "${IMAGE_REPOSITORY}@${INDEX_DIGEST}" \
            --source-uri github.com/nwarila-platform/workflow-template-drift \
            --source-tag "v${version}" \
            --builder-id "${SLSA_BUILDER_ID}" \
            --print-provenance > dist/verify/provenance.json
          test -s dist/verify/provenance.json
      - name: Run determinism golden and exact usage path on both platforms
        run: |
          set -euo pipefail
          test ! -e "${DOCKER_CONFIG}/config.json"
          report_failure() {
            local arch="$1"
            local oracle="$2"
            local status="$3"
            local stderr_path="$4"
            printf 'runtime verification failed: arch=%s oracle=%s observed_status=%s\n' \
              "${arch}" "${oracle}" "${status}" >&2
            printf 'stderr (first 4096 bytes from %s):\n' "${stderr_path}" >&2
            if [[ -f "${stderr_path}" ]]; then
              head -c 4096 -- "${stderr_path}" >&2 || true
              printf '\n' >&2
            else
              printf '<missing>\n' >&2
            fi
            exit 1
          }

          printf '%s\n' 'template-drift: error: invalid_usage: invalid command-line arguments' \
            > dist/verify/usage.expected

          while read -r arch child_digest _; do
            text_stdout="dist/verify/golden-${arch}.text.stdout"
            text_stderr="dist/verify/golden-${arch}.text.stderr"
            status=0
            docker run --quiet --rm --platform "linux/${arch}" --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
              -v "$PWD/fixtures/determinism/workspace:/workspace:ro" \
              -v "$PWD/fixtures/determinism/source:/template:ro" \
              "${IMAGE_REPOSITORY}@${child_digest}" \
              --workspace /workspace --template example/determinism=/template --config drift.json --fail-on error --format text \
              > "${text_stdout}" 2> "${text_stderr}" || status=$?
            if [[ "${status}" -ne 1 ]]; then
              report_failure "${arch}" "text-exit" "${status}" "${text_stderr}"
            fi
            if [[ -s "${text_stderr}" ]]; then
              report_failure "${arch}" "text-stderr" "${status}" "${text_stderr}"
            fi
            if ! cmp -s "${text_stdout}" fixtures/goldens/determinism.text; then
              report_failure "${arch}" "text-bytes" "${status}" "${text_stderr}"
            fi

            patch_stdout="dist/verify/golden-${arch}.patch.stdout"
            patch_stderr="dist/verify/golden-${arch}.patch.stderr"
            status=0
            docker run --quiet --rm --platform "linux/${arch}" --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
              -v "$PWD/fixtures/determinism/workspace:/workspace:ro" \
              -v "$PWD/fixtures/determinism/source:/template:ro" \
              "${IMAGE_REPOSITORY}@${child_digest}" \
              --workspace /workspace --template example/determinism=/template --config drift.json --fail-on error --format patch \
              > "${patch_stdout}" 2> "${patch_stderr}" || status=$?
            if [[ "${status}" -ne 1 ]]; then
              report_failure "${arch}" "patch-exit" "${status}" "${patch_stderr}"
            fi
            if [[ -s "${patch_stderr}" ]]; then
              report_failure "${arch}" "patch-stderr" "${status}" "${patch_stderr}"
            fi
            if ! cmp -s "${patch_stdout}" fixtures/goldens/determinism.patch; then
              report_failure "${arch}" "patch-bytes" "${status}" "${patch_stderr}"
            fi

            usage_stdout="dist/verify/usage-${arch}.stdout"
            usage_stderr="dist/verify/usage-${arch}.stderr"
            status=0
            docker run --quiet --rm --platform "linux/${arch}" --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
              "${IMAGE_REPOSITORY}@${child_digest}" \
              > "${usage_stdout}" 2> "${usage_stderr}" || status=$?
            if [[ "${status}" -ne 2 ]]; then
              report_failure "${arch}" "usage-exit" "${status}" "${usage_stderr}"
            fi
            if [[ -s "${usage_stdout}" ]]; then
              report_failure "${arch}" "usage-stdout" "${status}" "${usage_stderr}"
            fi
            if ! cmp -s "${usage_stderr}" dist/verify/usage.expected; then
              report_failure "${arch}" "usage-stderr" "${status}" "${usage_stderr}"
            fi
            printf 'runtime verification passed: arch=%s child=%s\n' "${arch}" "${child_digest}"
          done < dist/verify/platform-records

  promote:
    name: Promote verified digest to consumer tags
    needs: [publish-candidate, verify]
    if: >-
      ${{ github.repository == 'nwarila-platform/workflow-template-drift' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-candidate.result == 'success' &&
      needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Crane
        run: |
          set -euo pipefail
          bash tools/install-crane.sh
          printf '%s\n' "${PWD}/dist/tools" >> "${GITHUB_PATH}"
      - name: Log in to GHCR for promotion
        env:
          GHCR_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${REGISTRY_USER}" --password-stdin
      - name: Revalidate create-once policy, apply exactly two tags, and read them back
        env:
          INDEX_DIGEST: ${{ needs.publish-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${INDEX_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${GITHUB_REPOSITORY}" = nwarila-platform/workflow-template-drift
          test "${GITHUB_REF}" = "refs/tags/v${version}"
          test "$(git cat-file -t "${GITHUB_SHA}")" = commit
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(crane digest "${IMAGE_REPOSITORY}@${INDEX_DIGEST}")" = "${INDEX_DIGEST}"

          aliases=("${version}" "sha-${GITHUB_SHA}")
          check_alias() {
            local alias="$1"
            local error_file="dist/crane-${alias}.stderr"
            local observed
            if observed="$(crane digest "${IMAGE_REPOSITORY}:${alias}" 2> "${error_file}")"; then
              if [[ "${observed}" != "${INDEX_DIGEST}" ]]; then
                printf 'create-once violation: %s:%s is %s, candidate is %s\n' \
                  "${IMAGE_REPOSITORY}" "${alias}" "${observed}" "${INDEX_DIGEST}" >&2
                exit 1
              fi
              printf 'existing alias already equals candidate: %s:%s=%s\n' \
                "${IMAGE_REPOSITORY}" "${alias}" "${observed}"
            elif grep -Eiq 'MANIFEST_UNKNOWN|NAME_UNKNOWN|manifest unknown|not found|404' "${error_file}"; then
              printf 'alias is absent and eligible for creation: %s:%s\n' "${IMAGE_REPOSITORY}" "${alias}"
            else
              cat "${error_file}" >&2
              printf 'could not classify alias lookup failure for %s:%s\n' "${IMAGE_REPOSITORY}" "${alias}" >&2
              exit 1
            fi
          }

          mkdir -p dist
          for alias in "${aliases[@]}"; do
            check_alias "${alias}"
          done
          for alias in "${aliases[@]}"; do
            crane tag "${IMAGE_REPOSITORY}@${INDEX_DIGEST}" "${alias}"
          done
          for alias in "${aliases[@]}"; do
            observed="$(crane digest "${IMAGE_REPOSITORY}:${alias}")"
            if [[ "${observed}" != "${INDEX_DIGEST}" ]]; then
              printf 'post-promotion digest mismatch: %s:%s=%s expected=%s\n' \
                "${IMAGE_REPOSITORY}" "${alias}" "${observed}" "${INDEX_DIGEST}" >&2
              exit 1
            fi
            printf 'consumer alias verified: %s:%s=%s\n' "${IMAGE_REPOSITORY}" "${alias}" "${observed}"
          done
